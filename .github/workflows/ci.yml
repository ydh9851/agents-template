name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  # CI 不需要真实 API Key：Mock 模式下状态机完整流转
  MOCK_LLM: "true"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: 全量依赖 · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 运行测试
        run: pytest -v

      - name: 冒烟：构建索引 + 跑通一个任务
        run: |
          python tools/ingest.py
          python tools/run_task.py "CI 冒烟测试：验证最小链路"

      - name: 打印索引状态（便于排查）
        run: python tools/ingest.py

  degraded:
    name: 降级路径 · 不装 chromadb / 切分器
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 刻意不装 chromadb 与 langchain-text-splitters，
      # 用来验证「向量库降级为本地 JSON」「切分器降级为内置实现」这两条容错路径真的可用。
      - name: 安装最小依赖
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi==0.115.6" \
            "uvicorn[standard]==0.34.0" \
            "sse-starlette==2.2.1" \
            "pydantic-settings==2.7.1" \
            "python-dotenv==1.0.1" \
            "langgraph==0.2.60" \
            "langgraph-checkpoint-sqlite>=2.0.0,<3.0.0" \
            "langchain-core==0.3.29" \
            "langchain-openai==0.2.14" \
            "rank-bm25==0.2.2" \
            "numpy==1.26.4" \
            "pytest==8.3.4"

      - name: 确认降级依赖确实缺席
        run: |
          python -c "import importlib.util as u; assert u.find_spec('chromadb') is None, 'chromadb 不应存在'; print('chromadb 缺席 OK')"
          python -c "import importlib.util as u; assert u.find_spec('langchain_text_splitters') is None, '切分器不应存在'; print('切分器缺席 OK')"

      - name: 运行测试（应全部走降级实现）
        run: pytest -v

      - name: 冒烟：降级后端下跑通一个任务
        run: |
          python tools/ingest.py
          python tools/run_task.py "降级路径冒烟测试"
